<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fly Dimo Fly</title>
<meta name="description" content="Fly Dimo Fly — a Flappy Bird style dodge-the-barricades game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff3d7f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fly Dimo">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud"><div id="score-card"><div id="score">0</div></div></div>
  <div class="toast" id="toast"></div>
  <div id="overlay">
    <h1>FLY DIMO FLY</h1>
    <div class="sub">Tap to flap. Weave through Constable Dhakkan's barricades, grab golden samosas for a shield, and don't clip the top or bottom.</div>
    <div class="stat" id="finalStat"></div>
    <div id="best"></div>
    <button id="playBtn">START</button>
    <div id="controls-hint"><span>Tap / Click / Space to flap</span></div>
  </div>
  <div id="mute" aria-label="Toggle sound">&#128266;</div>
  <button id="installBtn" aria-label="Install app">&#8681;&nbsp;Install App</button>
</div>

<audio id="sfxBump" preload="auto" src="assets/sfx-bump.mp3"></audio>
<audio id="sfxBooster" preload="auto" src="assets/sfx-booster.mp3"></audio>
<audio id="sfxCaught" preload="auto" src="assets/sfx-caught.mp3"></audio>
<audio id="bgm" preload="auto" loop src="assets/bgm.mp3"></audio>

<script src="game.js"></script>
<script>
  // PWA: register service worker (enables installability + offline play)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  // PWA: capture and defer the browser's install prompt (Android/Chrome/Edge)
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = 'flex';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
  });

  // iOS Safari has no beforeinstallprompt — show a manual hint instead,
  // but only if not already running as an installed app.
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (isIOS && !isStandalone) {
    installBtn.textContent = '\u2191 Add to Home Screen';
    installBtn.style.display = 'flex';
    installBtn.addEventListener('click', () => {
      alert('To install: tap the Share icon, then "Add to Home Screen".');
    });
  }
</script>
</body>
</html>
